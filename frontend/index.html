<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Virtual Assistant — Academic Project</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-container">
    <!-- Header -->
    <header class="chat-header">
      <div class="header-content">
        <div class="bot-badge">AI</div>
        <div>
          <h1 class="chat-title">AI Virtual Assistant</h1>
          <p class="chat-subtitle">CS Academic Project &bull; Classical Search, Problems &amp; Probabilistic AI</p>
        </div>
      </div>
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span class="status-text">Online</span>
      </div>
    </header>

    <!-- Quick Prompts Section -->
    <div class="quick-prompts-bar">
      <span class="prompts-label">Try asking:</span>
      <div class="chips-container" id="chipsContainer">
        <button class="prompt-chip" data-query="Run BFS">Run BFS</button>
        <button class="prompt-chip" data-query="Solve an 8 puzzle">Solve an 8 puzzle</button>
        <button class="prompt-chip" data-query="Show Towers of Hanoi">Show Towers of Hanoi</button>
        <button class="prompt-chip" data-query="Demonstrate Wumpus World">Demonstrate Wumpus World</button>
        <button class="prompt-chip" data-query="Explain the Hidden Markov Model">Explain HMM</button>
        <button class="prompt-chip" data-query="Run A*">Run A*</button>
        <button class="prompt-chip" data-query="Demonstrate D*">Demonstrate D*</button>
        <button class="prompt-chip" data-query="Run Simulated Annealing">Simulated Annealing</button>
        <button class="prompt-chip" data-query="Help">Help &amp; Topics</button>
      </div>
    </div>

    <!-- Messages Container -->
    <main class="chat-messages" id="messagesContainer" role="log" aria-live="polite">
      <!-- Welcome Message loaded by JS -->
    </main>

    <!-- Chat Input Area -->
    <footer class="chat-footer">
      <form id="chatForm" class="input-form">
        <input 
          type="text" 
          id="messageInput" 
          placeholder="Ask a question or enter a command (e.g. 'Run BFS', 'Solve 8 puzzle')..." 
          autocomplete="off"
          required
        />
        <button type="submit" id="sendBtn" class="send-btn" title="Send message">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
          <span>Send</span>
        </button>
      </form>
      <div class="footer-note">
        Rule-based academic demonstrator &bull; Demonstrates 13 classical AI algorithms
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
